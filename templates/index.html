<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local PDF Watermark</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --border: #dcdad5; --accent: #2f5d50; --accent-text: #ffffff;
    --ok: #2f7d4a; --err: #b3261e; --drop: #eef3f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161716; --card: #1f2120; --text: #ecece9; --muted: #9a9b98;
      --border: #343734; --accent: #7fbfa9; --accent-text: #0f1a16;
      --ok: #7ccf96; --err: #f2867d; --drop: #222b28;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=password] {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  #drop {
    border: 2px dashed var(--border); border-radius: 10px; padding: 28px 16px;
    text-align: center; color: var(--muted); cursor: pointer;
  }
  #drop.over { background: var(--drop); border-color: var(--accent); }
  #list { list-style: none; padding: 0; margin: 10px 0 0; }
  #list li {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  #list button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; }
  .row { display: flex; gap: 16px; }
  .row > div { flex: 1; }
  input[type=range] { width: 100%; }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--muted); }
  #go {
    margin-top: 20px; width: 100%; padding: 12px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; cursor: pointer;
  }
  #go:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 16px; font-size: 14px; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  .note { color: var(--muted); font-size: 13px; margin-top: 20px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Local PDF Watermark</h1>
  <p class="sub">Protect sensitive PDFs on your computer. Nothing is uploaded anywhere.</p>

  <form class="card" id="form">
    <label>PDF files</label>
    <div id="drop">Drop PDFs here or click to choose</div>
    <input type="file" id="picker" accept="application/pdf,.pdf" multiple hidden>
    <ul id="list"></ul>

    <label for="text">Watermark text</label>
    <input type="text" id="text" placeholder="e.g. For Agency X only – rental application – 2026-11-06" required>

    <details>
      <summary>Options</summary>
      <div class="row">
        <div>
          <label for="opacity">Opacity <span id="opv">25</span>%</label>
          <input type="range" id="opacity" min="5" max="100" value="25">
        </div>
        <div>
          <label for="size">Text size <span id="szv">28</span></label>
          <input type="range" id="size" min="10" max="80" value="28">
        </div>
      </div>
      <label for="color">Color</label>
      <input type="color" id="color" value="#808080">
      <label for="password">Password for the output PDF (optional)</label>
      <input type="password" id="password" autocomplete="new-password">
    </details>

    <button id="go" type="submit" disabled>Protect &amp; save to Downloads</button>
    <div id="status"></div>
  </form>

  <p class="note">Files are saved to <code>{{ downloads }}</code> as <code>name_protected.pdf</code>.<br>
  The originals are never modified.</p>
</main>

<script>
const files = [];
const $ = (id) => document.getElementById(id);
const drop = $("drop"), picker = $("picker"), list = $("list"), go = $("go"), status = $("status");

function refresh() {
  list.innerHTML = "";
  files.forEach((f, i) => {
    const li = document.createElement("li");
    li.textContent = f.name;
    const rm = document.createElement("button");
    rm.type = "button"; rm.textContent = "×"; rm.title = "Remove";
    rm.onclick = () => { files.splice(i, 1); refresh(); };
    li.appendChild(rm);
    list.appendChild(li);
  });
  go.disabled = !files.length || !$("text").value.trim();
}

function add(fileList) {
  for (const f of fileList) {
    if (f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf")) files.push(f);
  }
  refresh();
}

drop.onclick = () => picker.click();
picker.onchange = () => { add(picker.files); picker.value = ""; };
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); add(e.dataTransfer.files); };
$("text").oninput = refresh;
$("opacity").oninput = (e) => $("opv").textContent = e.target.value;
$("size").oninput = (e) => $("szv").textContent = e.target.value;

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData();
  files.forEach((f) => fd.append("files", f));
  fd.append("text", $("text").value);
  fd.append("opacity", $("opacity").value);
  fd.append("font_size", $("size").value);
  fd.append("color", $("color").value);
  fd.append("password", $("password").value);

  go.disabled = true;
  status.textContent = "Processing…";
  try {
    const res = await fetch("/protect", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Error");
    status.innerHTML = "";
    data.results.forEach((r) => {
      const div = document.createElement("div");
      div.className = r.ok ? "ok" : "err";
      div.textContent = r.ok ? `✓ ${r.name} → ${r.output}` : `✗ ${r.name}: ${r.error}`;
      status.appendChild(div);
    });
    if (data.results.some((r) => r.ok)) { files.length = 0; refresh(); }
  } catch (err) {
    status.innerHTML = `<div class="err">${err.message}</div>`;
  } finally {
    refresh();
  }
};
</script>
</body>
</html>
